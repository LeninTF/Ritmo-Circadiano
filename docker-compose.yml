services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-circadiano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circadiano_local}
      POSTGRES_DB: ${POSTGRES_DB:-circadiano}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - circadiano_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  circadiano_pgdata:
