name: zap-baseline

# Manual: escaneo pasivo (arana + reglas pasivas, sin ataques) solo contra el staging propio (RNF04).
on:
  workflow_dispatch:
    inputs:
      objetivo:
        description: URL de staging a escanear
        required: true
        default: https://ritmo-circadiano.onrender.com
        type: choice
        options:
          - https://ritmo-circadiano.onrender.com
          - https://ritmo-circadiano-pwa.lenin7777-lt.workers.dev

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - name: ZAP baseline
        run: |
          mkdir -p reporte && chmod 777 reporte
          docker run --rm -v "$PWD/reporte:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ inputs.objetivo }}" -m 2 -r zap.html -J zap.json -I
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-reporte
          path: reporte/
          retention-days: 30
