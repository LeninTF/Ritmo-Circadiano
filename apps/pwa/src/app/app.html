<div class="shell">
  <header class="cabecera">
    <a class="marca" routerLink="/plan" aria-label="CircaRuta, ir al plan">
      <!-- Isotipo "Solstice" (Figma); colores por token, cambia solo con el tema -->
      <svg class="marca__icono" viewBox="180 180 664 664" aria-hidden="true">
        <circle cx="512" cy="512" r="320" />
        <path d="M512 192a160 160 0 0 1 0 320a160 160 0 0 0 0 320" />
        <circle class="marca__sol" cx="440" cy="350" r="64" />
        <path
          class="relleno"
          d="M565.572 604.381C554.652 616.445 548 632.446 548 650C548 687.555 578.445 718 616 718C626.629 718 636.688 715.56 645.649 711.211C633.037 732.062 610.147 746 584 746C544.235 746 512 713.765 512 674C512 640.605 534.736 612.521 565.572 604.381Z"
        />
      </svg>
      <span>CircaRuta</span>
    </a>
    <button
      class="boton-tema"
      type="button"
      (click)="cambiarTema()"
      [attr.aria-label]="temaActual() === 'oscuro' ? 'Activar modo claro' : 'Activar modo oscuro'"
      [attr.title]="temaActual() === 'oscuro' ? 'Activar modo claro' : 'Activar modo oscuro'"
    >
      @if (temaActual() === 'oscuro') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
      }
      <span class="boton-tema__texto">{{ temaActual() === 'oscuro' ? 'Modo claro' : 'Modo oscuro' }}</span>
    </button>
  </header>

  <main id="contenido-principal" tabindex="-1">
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    @for (enlace of enlaces; track enlace.ruta) {
      <a
        [routerLink]="enlace.ruta"
        routerLinkActive="activo"
        #estadoRuta="routerLinkActive"
        [attr.aria-current]="estadoRuta.isActive ? 'page' : null"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          @switch (enlace.icono) {
            @case ('hoy') {
              <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
              <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            }
            @case ('cafeina') {
              <path d="M10 2v2M14 2v2M6 2v2" />
              <path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1" />
            }
            @case ('presalida') {
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              <path d="m9 12 2 2 4-4" />
            }
            @case ('diario') {
              <path d="M12 7v14" />
              <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
            }
          }
        </svg>
        <span class="bottom-nav__etiqueta">{{ enlace.texto }}</span>
      </a>
    }
  </nav>
</div>
